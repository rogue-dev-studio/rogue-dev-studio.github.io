<body class="page-contact">
    <div class="bg-pattern"></div>

    <nav>
        <a href="../" class="logo">ROGUE DEVELOPER</a>
        <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav" data-i18n-aria="navMenuAria" data-i18n="navMenu">Menu</button>
        <ul class="nav-links" id="site-nav">
            <li><a href="../#projects" data-i18n="navProjects">Karya</a></li>
            <li><a href="../#toolkit" data-i18n="navToolkit">Toolkit</a></li>
            <li><a href="https://rogue-dev-studio.github.io/rogue-asset-store/" rel="noopener" data-i18n="navAssets">Assets</a></li>
            <li><a href="../lab/" data-i18n="navLab">Lab</a></li>
            <li><a href="../cv/" data-i18n="navCv">CV</a></li>
            <li><a href="./" aria-current="page" data-i18n="navContact">Kontak</a></li>
        </ul>
    </nav>

    <main>
        <section class="contact-section contact-page" id="contact">
            <p class="contact-eyebrow" data-i18n="contactEyebrow">Rogue Developer · Kontak</p>
            <h1 data-i18n="contactTitle">Mari Berkolaborasi</h1>
            <p data-i18n="contactLead">Ceritakan kebutuhan proyek Anda. Saya akan membalas ke email yang Anda cantumkan.</p>

            <form class="contact-form" id="contact-form" novalidate autocomplete="on">
                <div class="form-trap" aria-hidden="true">
                    <label for="contact-company-url">Company website</label>
                    <input type="text" id="contact-company-url" name="company_url" data-contact-trap tabindex="-1" autocomplete="off">
                </div>

                <div class="form-row">
                    <label for="contact-name" data-i18n="labelName">Nama</label>
                    <input type="text" id="contact-name" name="name" required autocomplete="name">
                </div>
                <div class="form-row">
                    <label for="contact-email" data-i18n="labelEmail">Email Anda</label>
                    <input type="email" id="contact-email" name="email" required autocomplete="email">
                </div>
                <div class="form-row">
                    <label for="contact-need" data-i18n="labelNeed">Kebutuhan</label>
                    <textarea id="contact-need" name="need" rows="4" required data-i18n-placeholder="needPlaceholder" placeholder="Contoh: landing bisnis, SaaS ringan, sistem informasi..."></textarea>
                </div>
                <div class="form-grid">
                    <div class="form-row">
                        <label for="contact-budget" data-i18n="labelBudget">Budget</label>
                        <select id="contact-budget" name="budget" required>
                            <option value="" data-i18n="budgetPlaceholder">Pilih kisaran</option>
                            <option value="5-10jt" data-i18n="budgetA">Rp5–10 jt</option>
                            <option value="10-25jt" data-i18n="budgetB">Rp10–25 jt</option>
                            <option value="25jt+" data-i18n="budgetC">Rp25 jt+</option>
                            <option value="belum-pasti" data-i18n="budgetD">Belum pasti / diskusi dulu</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label for="contact-timeline" data-i18n="labelTimeline">Timeline</label>
                        <select id="contact-timeline" name="timeline" required>
                            <option value="" data-i18n="timelinePlaceholder">Pilih target</option>
                            <option value="1-4-minggu" data-i18n="timelineA">1–4 minggu</option>
                            <option value="1-2-bulan" data-i18n="timelineB">1–2 bulan</option>
                            <option value="fleksibel" data-i18n="timelineC">Fleksibel</option>
                        </select>
                    </div>
                </div>

                <div class="form-row captcha-row">
                    <label class="form-check-label captcha-verify-check" for="captcha-verify-check">
                        <input type="checkbox" id="captcha-verify-check" name="captcha_verify" value="1" autocomplete="off">
                        <span data-i18n="captchaCheck">Saya bukan robot</span>
                    </label>
                    <div class="captcha-game-panel" id="contact-captcha-panel" hidden>
                        <div class="captcha-game-wrap arcade-cabinet" id="contact-captcha">
                            <div class="captcha-viewport" role="img" aria-label="Arcade hoop verifikasi">
                                <div class="captcha-power-hud" aria-live="polite">
                                    <div class="captcha-power-gauge" aria-hidden="true">
                                        <svg class="captcha-power-svg" viewBox="0 10 200 98" width="132" height="65">
                                            <g fill="none" stroke-width="28" stroke-linecap="butt">
                                                <path stroke="#1b7a3d" d="M22.03 97.96 A78 78 0 0 1 31.45 62.78"/>
                                                <path stroke="#7cbb2c" d="M33.49 59.25 A78 78 0 0 1 59.25 33.49"/>
                                                <path stroke="#f5d031" d="M62.78 31.45 A78 78 0 0 1 97.96 22.03"/>
                                                <path stroke="#f0a020" d="M102.04 22.03 A78 78 0 0 1 137.22 31.45"/>
                                                <path stroke="#e85a2b" d="M140.75 33.49 A78 78 0 0 1 166.51 59.25"/>
                                                <path stroke="#e53935" d="M168.55 62.78 A78 78 0 0 1 177.97 97.96"/>
                                            </g>
                                            <g data-power-needle transform="rotate(0 100 100)">
                                                <polygon points="28,100 94,91.5 94,108.5" fill="#111"/>
                                                <circle cx="100" cy="100" r="9" fill="#111"/>
                                                <circle cx="100" cy="100" r="3.6" fill="#f4f4f4"/>
                                            </g>
                                        </svg>
                                    </div>
                                    <span class="captcha-power-value" data-power-value data-zone="low">LOW</span>
                                    <span class="captcha-power-label">POWER</span>
                                </div>
                                <div class="captcha-time-hud" aria-live="polite">
                                    <span class="captcha-time-value" data-board="time">45</span>
                                    <span class="captcha-time-label">TIME</span>
                                </div>
                                <div class="captcha-score-flash" hidden>VERIFIED</div>
                                <div class="captcha-retry-overlay" hidden>
                                    <div class="captcha-timeup-popup" role="dialog" aria-labelledby="captcha-timeup-title">
                                        <p class="captcha-timeup-title" id="captcha-timeup-title">TIME OUT</p>
                                        <button type="button" class="btn btn-secondary captcha-refresh" id="captcha-refresh" data-i18n="captchaRetry">Ulangi</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <input type="hidden" id="contact-captcha-pass" name="captcha_pass" value="0">
                </div>

                <p id="contact-status" class="contact-status" role="status" aria-live="polite" hidden></p>
                <button type="submit" class="btn btn-primary" id="contact-submit" disabled data-i18n="contactSubmit">Kirim Pesan</button>
            </form>

            <p class="contact-sponsor" data-i18n-html="contactSponsorShort"><a href="https://github.com/sponsors/rogue-dev-studio" target="_blank" rel="noopener noreferrer">Sponsor di GitHub</a> · <a href="https://www.patreon.com/c/roguedevstudio" target="_blank" rel="noopener noreferrer">Patreon</a></p>
        </section>
    </main>

    <div data-include="../partials/footer.html"></div>

    <script src="../js/site-i18n.js?v=20260929j"></script>
    <script src="../js/contact.js?v=20260929j"></script>
</body>
</html>
